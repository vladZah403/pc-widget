[package]
name = "pcm-core"
description = "PC Monitor 2.0: the data model and every calculation that doesn't need Windows"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
zstd = "0.13"
toml = "1"
minisign-verify = "0.3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
