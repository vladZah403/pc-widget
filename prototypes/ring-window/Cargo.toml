[package]
name = "pcm-proto-ring"
description = "Stage 0 prototype: a transparent layered window with a ring gauge drawn by tiny-skia"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
tiny-skia = "0.11"
fontdue = "0.9"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]
