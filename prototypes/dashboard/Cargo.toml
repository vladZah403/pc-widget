[package]
name = "pcm-proto-dashboard"
description = "Stage 0 prototype: the dashboard window in egui with a tiny-skia card as a texture"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
tiny-skia = "0.11"
fontdue = "0.9"

[features]
# render with wgpu (Direct3D 12 / Vulkan) instead of OpenGL, to compare memory
wgpu = ["eframe/wgpu"]

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]
