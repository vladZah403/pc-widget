# Builds PC-Monitor.zip on GitHub's Windows machines.
# - every push to main: build + quick start check, zip kept as a run artifact
# - a pushed tag v*: the same, then a GitHub Release with the zip attached
#   (notes from docs/releases/<tag>.md, or generated from commits if it's missing)
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write  # only to create the release

env:
  LHM_VERSION: "0.9.6"
  # checksum of LibreHardwareMonitor.zip from that release: a changed file stops the build
  LHM_SHA256: "086D9F1B5A99E643EDC2CFAAAC16051685B551E4C5AC0B32A57C58C0E529C001"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check that the tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'EOF'
          import os, re, sys
          have = re.search(r'APP_VERSION = "(.+?)"', open("widget.pyw", encoding="utf-8").read()).group(1)
          want = os.environ["GITHUB_REF_NAME"][1:]
          sys.exit(0 if have == want else f"APP_VERSION is {have}, but the tag is v{want}")
          EOF

      - name: Install Python packages
        run: python -m pip install -r requirements-build.txt pytest==8.3.4

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Get LibreHardwareMonitorLib
        shell: pwsh
        run: |
          $url = "https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v$env:LHM_VERSION/LibreHardwareMonitor.zip"
          Invoke-WebRequest $url -OutFile lhm-release.zip
          $hash = (Get-FileHash lhm-release.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:LHM_SHA256) { throw "LibreHardwareMonitor.zip checksum mismatch: $hash" }
          Expand-Archive lhm-release.zip -DestinationPath lhm-release
          New-Item -ItemType Directory lhm | Out-Null
          foreach ($dll in Get-Content lhm-files.txt) {
            Copy-Item (Join-Path lhm-release $dll) lhm -ErrorAction Stop
          }

      - name: Build
        shell: cmd
        run: build_exe.bat

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path widget.pyw -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Check that the installer installs, runs and uninstalls
        shell: pwsh
        run: |
          Start-Process dist\PC-Monitor-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\PC-Monitor"
          if (-not (Test-Path "$app\PC-Monitor.exe")) { throw "not installed" }
          Start-Process "$app\PC-Monitor.exe" -ArgumentList "--diag" -Wait
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          # the uninstaller hands over to a copy of itself in %TEMP%: wait for it to finish
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\PC-Monitor.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\PC-Monitor.exe") { throw "not uninstalled" }

      - name: Check that the build starts
        shell: pwsh
        run: |
          Start-Process dist\PC-Monitor\PC-Monitor.exe -ArgumentList "--diag" -Wait
          $diag = Get-Content "$env:APPDATA\PC-Monitor\pc-monitor-diag.txt" -Raw
          Write-Output $diag
          if ($diag -notmatch "frozen: True") { throw "the built program did not start" }
          if ($diag -notmatch "certificates: certifi ok") { throw "certifi is not in the build (update checks fail on a fresh Windows)" }

      - uses: actions/upload-artifact@v4
        with:
          name: PC-Monitor
          path: |
            dist/PC-Monitor.zip
            dist/PC-Monitor-Setup.exe
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="docs/releases/$tag.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" dist/PC-Monitor.zip dist/PC-Monitor-Setup.exe --title "PC Monitor ${tag#v}" --notes-file "$notes"
          else
            gh release create "$tag" dist/PC-Monitor.zip dist/PC-Monitor-Setup.exe --title "PC Monitor ${tag#v}" --generate-notes
          fi
