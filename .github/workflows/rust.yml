# PC Monitor 2.0 (Rust): checks every push to main and v2, and pull requests.
# fmt, clippy and the tests, then a release build of PC-Monitor.exe and the
# sensor helper, and `PC-Monitor.exe --diag` on GitHub's Windows machine.
# A pushed tag v2.* does the same, then publishes a PRE-release with the zip
# and the setup (notes: docs/releases/<tag>.md). It is unsigned: 2.0 never
# installs it and 1.8 never sees pre-releases. The signature, made on Vlad's
# PC, comes with signatures/<tag>.minisig (release-signature.yml).
name: Rust

on:
  push:
    branches: [main, v2]
    tags: ["v2.*"]
  pull_request:

permissions:
  contents: write  # only to create the release

env:
  CARGO_TERM_COLOR: always
  LHM_VERSION: "0.9.6"
  # checksum of LibreHardwareMonitor.zip from that release: a changed file stops the build
  LHM_SHA256: "086D9F1B5A99E643EDC2CFAAAC16051685B551E4C5AC0B32A57C58C0E529C001"

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v2.')
        shell: bash
        run: |
          have=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          [ "v$have" = "$GITHUB_REF_NAME" ] || { echo "Cargo.toml says $have, the tag is $GITHUB_REF_NAME"; exit 1; }
          [ -f "docs/releases/$GITHUB_REF_NAME.md" ] || { echo "no docs/releases/$GITHUB_REF_NAME.md"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build PC-Monitor.exe
        # the C runtime inside the exe: no Visual C++ redistributable needed on users' PCs
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p pcm-app

      - name: Get LibreHardwareMonitorLib
        shell: pwsh
        run: |
          $url = "https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v$env:LHM_VERSION/LibreHardwareMonitor.zip"
          Invoke-WebRequest $url -OutFile lhm-release.zip
          $hash = (Get-FileHash lhm-release.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:LHM_SHA256) { throw "LibreHardwareMonitor.zip checksum mismatch: $hash" }
          Expand-Archive lhm-release.zip -DestinationPath lhm-release
          New-Item -ItemType Directory lhm | Out-Null
          foreach ($dll in Get-Content lhm-files.txt) {
            Copy-Item (Join-Path lhm-release $dll) lhm -ErrorAction Stop
          }

      - name: Build the sensor helper
        shell: cmd
        run: sensors-helper\build.bat

      - name: --diag
        shell: pwsh
        run: |
          # a Windows program (no console of its own): wait for it, read what it wrote
          Start-Process target\release\PC-Monitor.exe -Wait -NoNewWindow `
            -ArgumentList "--diag", "--helper", "sensors-helper\bin\pcm-sensors.exe", "--out", "diag.txt"
          $out = Get-Content diag.txt -Raw
          Write-Output $out
          foreach ($line in "cpu load: \d", "memory: ", "volume: C:", "process: ", "sensor helper: LHM") {
            if ($out -notmatch $line) { throw "--diag has no '$line'" }
          }

      - name: Package PC-Monitor.zip
        shell: pwsh
        run: |
          ./package.ps1
          # the shape 1.8's updater accepts: PC-Monitor/PC-Monitor.exe and PC-Monitor/_internal/
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("$PWD/dist2/PC-Monitor.zip")
          $names = $zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') }
          $zip.Dispose()
          foreach ($need in "PC-Monitor/PC-Monitor.exe", "PC-Monitor/_internal/pcm-sensors.exe", "PC-Monitor/_internal/LibreHardwareMonitorLib.dll") {
            if ($names -notcontains $need) { throw "PC-Monitor.zip has no $need" }
          }

      - name: Targets (idle CPU and memory, exe size)
        # the plan's targets: a build that misses one is not released
        # (the PC Monitor window needs OpenGL, which GitHub's machines lack:
        # its <= 120 MB is measured on a real PC)
        shell: pwsh
        run: |
          $exe = "dist2\PC-Monitor\PC-Monitor.exe"
          $mb = (Get-Item $exe).Length / 1MB
          "exe: {0:N1} MB" -f $mb
          if ($mb -gt 15) { throw "the exe is over 15 MB" }
          $env:APPDATA = "$env:RUNNER_TEMP\idle"
          New-Item -ItemType Directory "$env:APPDATA\PC-Monitor" | Out-Null
          # the plan's case: the widget and the tray, the window closed
          Set-Content "$env:APPDATA\PC-Monitor\config-2.toml" "widget = true"
          $p = Start-Process $exe -ArgumentList "--autostart" -PassThru
          Start-Sleep -Seconds 30  # warming up: the helper starts, the first readings
          $t0 = (Get-Process -Id $p.Id).TotalProcessorTime
          Start-Sleep -Seconds 120
          $proc = Get-Process -Id $p.Id
          $cpu = ($proc.TotalProcessorTime - $t0).TotalSeconds / 120 * 100
          $mem = $proc.PrivateMemorySize64 / 1MB
          $h = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id) and Name='pcm-sensors.exe'"
          $hmem = if ($h) { (Get-Process -Id $h.ProcessId).PrivateMemorySize64 / 1MB } else { 0 }
          $line = "idle 2 min: CPU {0:N2}% of one core, {1:N1} MB private; sensor helper {2:N1} MB; exe {3:N1} MB" -f $cpu, $mem, $hmem, $mb
          # an annotation: readable on the run's page and through GitHub's public API
          "::notice title=Targets::$line"
          Stop-Process -Id $p.Id -Force
          if ($h) { Stop-Process -Id $h.ProcessId -Force -ErrorAction SilentlyContinue }
          if ($cpu -gt 1) { throw "idle CPU over 1% of one core" }
          if ($mem -gt 30) { throw "over 30 MB without the helper" }
          if ($mem + $hmem -gt 70) { throw "over 70 MB with the helper" }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          # while 2.0 is tried next to 1.8 (elevation.rs), the setup has its own AppId and folder
          $beside = Select-String -Path crates\pcm-app\src\elevation.rs -Pattern '^pub const BESIDE_1_8: bool = true;' -Quiet
          $defines = @("/DAppVersion=$version")
          if ($beside) { $defines += "/DBeside18" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q @defines installer2.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $folder = if ($beside) { "PC-Monitor 2" } else { "PC-Monitor" }
          "APP_FOLDER=$env:LOCALAPPDATA\Programs\$folder" | Out-File $env:GITHUB_ENV -Append

      - name: Check that the installer installs, runs and uninstalls
        shell: pwsh
        run: |
          Start-Process dist2\PC-Monitor-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=autostart" -Wait
          $app = $env:APP_FOLDER
          if (-not (Test-Path "$app\PC-Monitor.exe")) { throw "not installed in $app" }
          if (-not (Test-Path "$app\_internal\pcm-sensors.exe")) { throw "no sensor helper in $app" }
          $exe = [regex]::Escape("$app\PC-Monitor.exe")
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue
          if (-not (@($run.PSObject.Properties.Value) -match ($exe + '" --autostart'))) { throw "no autostart entry" }
          Start-Process "$app\PC-Monitor.exe" -ArgumentList "--diag", "--out", "$env:RUNNER_TEMP\diag-installed.txt" -Wait
          if (-not (Select-String -Path "$env:RUNNER_TEMP\diag-installed.txt" -Pattern "sensor helper: LHM" -Quiet)) { throw "the installed program can't read its helper" }
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          # the uninstaller hands over to a copy of itself in %TEMP%: wait for it to finish
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\PC-Monitor.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\PC-Monitor.exe") { throw "not uninstalled" }
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue
          if (@($run.PSObject.Properties.Value) -match $exe) { throw "the autostart entry stayed" }

      - name: Downloads from GitHub (live)
        # WinHTTP gets the API answer and the latest release's zip through the redirect;
        # the token lifts the API's 60-an-hour limit for the shared CI machines
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo test -p pcm-win -- --ignored live

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 1.8's updater installs this 2.0
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt --quiet
          python tests\ci\update_from_1_8.py dist2\PC-Monitor.zip "$env:RUNNER_TEMP\u18"
          if ($LASTEXITCODE -ne 0) { throw "1.8's updater failed" }

      - name: Check the swap and 2.0's first start with 1.8's settings
        shell: pwsh
        run: |
          $app = "$env:WORK\PC-Monitor"
          $cfg = "$env:WORK\appdata\PC-Monitor\config-2.toml"
          # 1.8's PowerShell waits for python, swaps the folders and starts 2.0, which takes 1.8's settings
          for ($i = 0; $i -lt 90 -and -not (Test-Path $cfg); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 2
          Get-Process PC-Monitor -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$app\*" } | Stop-Process -Force
          if (Test-Path "$app\old-1.8.txt") { throw "the 1.8 folder was not swapped out" }
          if ((Get-FileHash "$app\PC-Monitor.exe").Hash -ne (Get-FileHash dist2\PC-Monitor\PC-Monitor.exe).Hash) { throw "the program folder has no 2.0" }
          if (-not (Test-Path $cfg)) { throw "2.0 did not start, or did not take the 1.8 settings" }
          $text = Get-Content $cfg -Raw
          Write-Output $text
          if ($text -notmatch 'theme = "neon"' -or $text -notmatch 'lang = "en"') { throw "1.8's settings were not taken over" }

      - name: 2.0 updates itself (--finish-update)
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\u20"; $app = "$root\PC-Monitor"; $new = "$root\PC-Monitor.new"
          New-Item -ItemType Directory $root | Out-Null
          Copy-Item dist2\PC-Monitor $app -Recurse
          Set-Content "$app\old-2.0.txt" "old"
          Expand-Archive dist2\PC-Monitor.zip "$root\unzip"
          Move-Item "$root\unzip\PC-Monitor" $new
          $env:APPDATA = "$root\appdata"  # the program it starts keeps its settings here
          # stands for the old version: --finish-update waits for it to exit
          $old = Start-Process cmd -ArgumentList "/c", "ping -n 3 127.0.0.1 >nul" -PassThru -WindowStyle Hidden
          $p = Start-Process "$new\PC-Monitor.exe" -ArgumentList "--finish-update", $app, $old.Id -PassThru
          $null = $p.Handle  # keeps the exit code readable
          if (-not $p.WaitForExit(90000)) { throw "--finish-update hangs" }
          $code = $p.ExitCode
          if ($code -ne 0) { throw "--finish-update exit $code" }
          if (Test-Path "$app\old-2.0.txt") { throw "the old folder is still in place" }
          if (-not (Test-Path "$app\_internal\pcm-sensors.exe")) { throw "the new folder is incomplete" }
          # the new version it started clears away PC-Monitor.old and PC-Monitor.new
          for ($i = 0; $i -lt 20 -and ((Test-Path "$root\PC-Monitor.old") -or (Test-Path $new)); $i++) { Start-Sleep -Seconds 1 }
          $running = @(Get-Process PC-Monitor -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$app\*" })
          $running | Stop-Process -Force
          if (-not $running) { throw "the new version did not start" }
          if ((Test-Path "$root\PC-Monitor.old") -or (Test-Path $new)) { throw "the leftovers stayed" }

      - uses: actions/upload-artifact@v4
        with:
          name: PC-Monitor-2
          path: |
            dist2/PC-Monitor.zip
            dist2/PC-Monitor-Setup.exe
          retention-days: 14

      - name: Publish the pre-release (unsigned until signatures/<tag>.minisig comes)
        if: startsWith(github.ref, 'refs/tags/v2.')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" dist2/PC-Monitor.zip dist2/PC-Monitor-Setup.exe --prerelease \
            --title "PC Monitor ${tag#v}" --notes-file "docs/releases/$tag.md"
